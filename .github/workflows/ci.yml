name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Inspect example Skill
        run: local-prompt-studio --skill examples/storyboard-skill --inspect-skill
      - name: Validate example output
        run: local-prompt-studio --skill examples/storyboard-skill --validate-only examples/expected-output.txt
      - name: Inspect structured music Skill
        run: local-prompt-studio --skill examples/write-music-caption --inspect-skill
      - name: Validate structured music output
        run: local-prompt-studio --skill examples/write-music-caption --validate-only examples/music-caption-expected-output.txt
      - name: Validate recorded compatibility output
        run: local-prompt-studio --skill examples/storyboard-skill --validate-only compatibility/fixtures/lm-studio-windows-2026-08-13-output.txt

  quality:
    name: quality
    if: ${{ always() }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the required matrix passed
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = "success"
