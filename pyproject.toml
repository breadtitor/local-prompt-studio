[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-prompt-studio"
version = "0.2.0"
description = "A private-by-default prompt workspace for OpenAI-compatible local model servers."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Qiaoxi Guo" }
]
keywords = ["local-llm", "prompt-engineering", "lm-studio", "openai-compatible", "privacy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "jsonschema>=4.25.0",
  "ruff>=0.12.0",
]

[project.scripts]
local-prompt-studio = "local_prompt_studio.cli:main"
local-prompt-studio-gui = "local_prompt_studio.gui:main"

[project.urls]
Homepage = "https://github.com/breadtitor/local-prompt-studio"
Issues = "https://github.com/breadtitor/local-prompt-studio/issues"

[tool.setuptools.packages.find]
include = ["local_prompt_studio*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
